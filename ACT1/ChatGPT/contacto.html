<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto · Galería de Dibujos</title>
    <link rel="stylesheet" href="estilosIA.css">
</head>
<body>
<header class="encabezado"><nav class="navbar">
    <a class="logo" href="index.html">Galería ✦</a>
    <div class="nav-links">
        <a href="index.html#catalogo">Catálogo</a>
        <a href="mantenedor.html">Quién mantiene el sitio</a>
        <a href="contacto.html">Contacto</a>
    </div>
</nav></header>

<main class="pagina">
    <section class="tarjeta">
        <p class="eyebrow">Contacto</p>
        <h1>Escribinos</h1>
        <form action="#" method="post">
            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" type="text" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>

            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" rows="7" required></textarea>

            <button type="submit">Enviar</button>
        </form>
    </section>
</main>
<footer><p>Galería de Dibujos · HTML + CSS</p></footer>
</body>
</html>
